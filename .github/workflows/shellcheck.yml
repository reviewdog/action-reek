name: shellcheck
on: [pull_request]

jobs:
  shellcheck:
    name: check / shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: shellcheck
        uses: reviewdog/action-shellcheck@v1.29.0
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          pattern: "*.sh"
          fail_level: any
